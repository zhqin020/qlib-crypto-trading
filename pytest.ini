[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# No longer need to ignore - Issue #2 resolved by converting to proper tests

# Timeout configuration (Issue #6)
timeout = 300
timeout_method = thread
timeout_func_only = true

addopts =
    -v
    --strict-markers
    --disable-warnings
    -m "not requires_server"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_server: marks tests that require a running API server (deselect with '-m "not requires_server"')
    mcp: marks MCP server tests
    data: marks data pipeline tests
    model: marks model training tests
    backtest: marks backtesting tests
    api: marks API tests
    monitor: marks process monitor tests

# pytest-xdist configuration for parallel execution
[pytest:xdist]
# Distribute tests based on module to minimize test isolation issues
looponfail = False
