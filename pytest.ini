[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore non-pytest compatible test scripts (see Issue #2)
collect_ignore =
    tests/test_mcp_stdio.py
    tests/test_mcp_protocol.py
    tests/test_mcp_list_tools.py

# Timeout configuration (Issue #6)
timeout = 300
timeout_method = thread
timeout_func_only = true

addopts =
    -v
    --strict-markers
    --disable-warnings
    -m "not requires_server"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_server: marks tests that require a running API server (deselect with '-m "not requires_server"')
