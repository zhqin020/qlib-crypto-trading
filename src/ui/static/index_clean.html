                        * {
                            margin: 0;

                        body {

                                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,

                            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                            min-height: 100vh;
                            color: #333;
                        }
                        .container {
                            max-width: 1800px;
                            margin: 0 auto;
                            padding: 20px;
                        }
                        .header {
                            background: white;
                            padding: 20px 30px;
                            border-radius: 15px;
                            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
                            margin-bottom: 20px;
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        }
                        .header h1 {
                            color: #667eea;
                            font-size: 1.8em;
                            display: flex;
                            align-items: center;
                            gap: 15px;
                        }
                        .connection-status {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            padding: 8px 16px;
                            border-radius: 20px;
                            font-size: 0.9em;
                            font-weight: 600;
                        }
                        .status-dot {
                            width: 10px;
                            height: 10px;
                            border-radius: 50%;
                            animation: pulse 2s infinite;
                        }
                        .connected {
                            background: #d4edda;
                            color: #155724;
                        }
                        .connected .status-dot {
                            background: #28a745;
                        }
                        .disconnected {
                            background: #f8d7da;
                            color: #721c24;
                        }
                        .disconnected .status-dot {
                            background: #dc3545;
                        }
                        @keyframes pulse {
                            0%,
                            100% {
                                opacity: 1;
                            }
                            50% {
                                opacity: 0.5;
                            }
                        }

                        font-size: 11px;

                    /* Forms */
                    .form-group {
                        margin-bottom: 16px;
                    }

                    .form-label {
                        display: block;
                        font-size: 13px;
                        font-weight: 500;
                        margin-bottom: 6px;
                        color: var(--text-secondary);
                    }

                    .form-input, .form-select, .form-textarea {
                        width: 100%;
                        padding: 10px 12px;
                        background: var(--bg-tertiary);
                        border: 1px solid var(--border-color);
                        border-radius: 6px;
                        color: var(--text-primary);
                        font-size: 14px;
                        font-family: inherit;
                        transition: all 0.2s;
                    }

                    .form-input:focus, .form-select:focus, .form-textarea:focus {
                        outline: none;
                        border-color: var(--accent-primary);
                        background: var(--bg-elevated);
                    }

                    .form-textarea {
                        resize: vertical;
                        min-height: 80px;
                        font-family: 'JetBrains Mono', monospace;
                        font-size: 13px;
                    }

                    .form-checkbox-group {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 16px;
                    }

                    .form-checkbox {
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        cursor: pointer;
                    }

                    .form-checkbox input {
                        accent-color: var(--accent-primary);
                    }

                    /* Buttons */
                    .btn {
                        padding: 10px 20px;
                        border: none;
                        border-radius: 6px;
                        font-weight: 600;
                        font-size: 14px;
                        cursor: pointer;
                        transition: all 0.2s;
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                    }

                    .btn:hover:not(:disabled) {
                        transform: translateY(-1px);
                    }

                    .btn:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                    }

                    .btn-primary {
                        background: var(--accent-primary);
                        color: white;
                        width: 100%;
                    }

                    .btn-primary:hover:not(:disabled) {
                        background: #2563eb;
                    }

                    .btn-success {
                        background: var(--success);
                        color: white;
                    }

                    .btn-danger {
                        background: var(--danger);
                        color: white;
                    }

                    /* Result Box */
                    .result-box {
                        margin-top: 16px;
                        padding: 12px;
                        background: var(--bg-tertiary);
                        border: 1px solid var(--border-color);
                        border-radius: 6px;
                        font-family: 'JetBrains Mono', monospace;
                        font-size: 12px;
                        max-height: 200px;
                        overflow-y: auto;
                        white-space: pre-wrap;
                        word-break: break-all;
                    }

                    .result-box.success {
                        border-color: var(--success);
                        background: var(--success-bg);
                    }

                    .result-box.error {
                        border-color: var(--danger);
                        background: var(--danger-bg);
                    }

                    /* Activity Panel */
                    .activity-panel {
                        background: var(--bg-secondary);
                        border-left: 1px solid var(--border-color);
                        overflow-y: auto;
                        display: flex;
                        flex-direction: column;
