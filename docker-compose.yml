version: "3.8"

services:
  # Main API and Web UI
  api:
    build: .
    ports:
      - "5100:5100"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
      - ./backtests:/app/backtests
      - ./predictions:/app/predictions
      - ./experiments:/app/experiments
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PROCESS_MONITOR_REDIS_URL=${PROCESS_MONITOR_REDIS_URL:-redis://redis:6379/1}
      - PROCESS_MONITOR_REDIS_KEY=${PROCESS_MONITOR_REDIS_KEY:-process_monitor:processes}
      - PROCESS_MONITOR_CHANNEL=${PROCESS_MONITOR_CHANNEL:-process_monitor:events}
      - DATA_REFRESH_ENABLED=${DATA_REFRESH_ENABLED:-false}
      - DATA_REFRESH_SYMBOLS=${DATA_REFRESH_SYMBOLS:-BTC/USDT,ETH/USDT,BNB/USDT}
      - DATA_REFRESH_INTERVAL=${DATA_REFRESH_INTERVAL:-1d}
      - DATA_REFRESH_LOOKBACK_DAYS=${DATA_REFRESH_LOOKBACK_DAYS:-30}
      - DATA_REFRESH_FREQUENCY_MINUTES=${DATA_REFRESH_FREQUENCY_MINUTES:-180}
      - DATA_REFRESH_PROVIDER=${DATA_REFRESH_PROVIDER:-binance}
      - DATA_REFRESH_DATASET=${DATA_REFRESH_DATASET:-crypto}
      - DATA_REFRESH_CALENDAR=${DATA_REFRESH_CALENDAR:-crypto_1d}
      - DATA_REFRESH_OUTPUT_DIR=${DATA_REFRESH_OUTPUT_DIR:-data/raw}
      - SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION:-0.9.8}
    command: python -m uvicorn src.ui.api_enhanced:app --host 0.0.0.0 --port 5100 --reload
    networks:
      - qlib-network

  # MCP Server
  mcp-server:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
      - ./backtests:/app/backtests
      - ./predictions:/app/predictions
      - ./experiments:/app/experiments
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PROCESS_MONITOR_REDIS_URL=${PROCESS_MONITOR_REDIS_URL:-redis://redis:6379/1}
      - PROCESS_MONITOR_REDIS_KEY=${PROCESS_MONITOR_REDIS_KEY:-process_monitor:processes}
      - PROCESS_MONITOR_CHANNEL=${PROCESS_MONITOR_CHANNEL:-process_monitor:events}
      - DATA_REFRESH_ENABLED=${DATA_REFRESH_ENABLED:-false}
      - DATA_REFRESH_SYMBOLS=${DATA_REFRESH_SYMBOLS:-BTC/USDT,ETH/USDT,BNB/USDT}
      - DATA_REFRESH_INTERVAL=${DATA_REFRESH_INTERVAL:-1d}
      - DATA_REFRESH_LOOKBACK_DAYS=${DATA_REFRESH_LOOKBACK_DAYS:-30}
      - DATA_REFRESH_FREQUENCY_MINUTES=${DATA_REFRESH_FREQUENCY_MINUTES:-180}
      - DATA_REFRESH_PROVIDER=${DATA_REFRESH_PROVIDER:-binance}
      - DATA_REFRESH_DATASET=${DATA_REFRESH_DATASET:-crypto}
      - DATA_REFRESH_CALENDAR=${DATA_REFRESH_CALENDAR:-crypto_1d}
      - DATA_REFRESH_OUTPUT_DIR=${DATA_REFRESH_OUTPUT_DIR:-data/raw}
      - SETUPTOOLS_SCM_PRETEND_VERSION=${SETUPTOOLS_SCM_PRETEND_VERSION:-0.9.8}
    command: python -m src.mcp_server
    stdin_open: true
    tty: true
    networks:
      - qlib-network

  # PostgreSQL for metadata storage (optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=qlib_crypto
      - POSTGRES_USER=qlib
      - POSTGRES_PASSWORD=qlib_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5110:5432"
    networks:
      - qlib-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "5120:6379"
    networks:
      - qlib-network

volumes:
  postgres_data:

networks:
  qlib-network:
    driver: bridge
