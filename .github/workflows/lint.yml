name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  black:
    name: Code Formatting (Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Black
        run: pip install black>=23.0.0

      - name: Check formatting with Black
        run: |
          black --check --diff src/ tests/ scripts/
        continue-on-error: true  # Non-blocking temporarily, fix formatting in follow-up

  flake8:
    name: Style Check (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Flake8
        run: pip install flake8>=6.0.0

      - name: Run Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: false

  mypy:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy>=1.5.0
          pip install -r requirements.txt
          # Install qlib from source (not available on PyPI as pyqlib)
          pip install git+https://github.com/microsoft/qlib.git@main || echo "⚠️  Qlib install failed, type checking may be incomplete"

      - name: Run MyPy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # MyPy can be strict, make it non-blocking initially

  lint-summary:
    name: Lint Summary
    needs: [black, flake8, mypy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check lint results
        run: |
          echo "Linting execution complete"
          echo "Black (formatting): ${{ needs.black.result }}"
          echo "Flake8 (style): ${{ needs.flake8.result }}"
          echo "MyPy (types): ${{ needs.mypy.result }}"

          # Fail if critical linters failed (currently only Flake8)
          if [[ "${{ needs.flake8.result }}" != "success" ]]; then
            echo "❌ Critical linting checks failed"
            exit 1
          fi

          # Black and MyPy are informational for now
          if [[ "${{ needs.black.result }}" != "success" ]]; then
            echo "⚠️  Black formatting issues found (non-blocking, fix in follow-up)"
          fi

          if [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "⚠️  MyPy type checking found issues (non-blocking)"
          fi

          echo "✅ All critical lint checks passed"
